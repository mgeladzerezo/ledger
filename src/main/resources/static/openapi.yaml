openapi: 3.0.3
info:
  title: Ledger API
  version: 1.0.0
  description: |
    Double-entry payment ledger. Amounts are integers in minor units (cents). Every POST that
    changes state requires an `Idempotency-Key` header, scoped to the calling API key. The same key
    with the same body replays the stored response (header `Idempotent-Replayed: true`); the same
    key with a different body is 422; a duplicate that arrives while the original is still running
    waits for it, and after the wait budget gets 409 with `Retry-After`. Errors are RFC 9457
    problem documents (`application/problem+json`) with a stable `code` field.
servers:
  - url: http://localhost:8206
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque token from the previous page's nextCursor.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Problem:
      description: Problem document
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    Account:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE] }
        normalSide: { type: string, enum: [DEBIT, CREDIT] }
        currency: { type: string }
        status: { type: string, enum: [OPEN, FROZEN, CLOSED] }
        nonNegative: { type: boolean }
        balance: { type: integer, format: int64 }
        held: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
    Entry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        transactionId: { type: string, format: uuid }
        lineNo: { type: integer }
        accountId: { type: integer, format: int64 }
        side: { type: string, enum: [DEBIT, CREDIT] }
        amount: { type: integer, format: int64 }
        currency: { type: string }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        kind: { type: string }
        description: { type: string }
        reversesId: { type: string, format: uuid, nullable: true }
        reversedBy: { type: string, format: uuid, nullable: true }
        idempotencyKey: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
    Cash:
      type: object
      required: [accountId, amount, currency]
      properties:
        accountId: { type: integer, format: int64 }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
        description: { type: string }
    Transfer:
      type: object
      required: [fromAccountId, toAccountId, amount, currency]
      properties:
        fromAccountId: { type: integer, format: int64 }
        toAccountId: { type: integer, format: int64 }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
        description: { type: string }
paths:
  /api/v1/accounts:
    get:
      summary: List accounts (cursor pagination)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of accounts }
    post:
      summary: Open an account
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code, name, type, currency]
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string }
                currency: { type: string }
                nonNegative: { type: boolean }
      responses:
        '201': { description: Opened }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/accounts/{id}:
    get:
      summary: One account with its materialised balance
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: The account }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/accounts/{id}/entries:
    get:
      summary: The account's entries, newest first (cursor pagination)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of entries }
  /api/v1/accounts/{id}/statement:
    get:
      summary: Daily statement for a UTC day
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Opening balance, lines with running balance, closing balance }
  /api/v1/accounts/{id}/status:
    post:
      summary: Change account status
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Updated }
  /api/v1/accounts/{id}/rebuild-balance:
    post:
      summary: Recompute the materialised balance from the entries
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: The repaired account }
  /api/v1/deposits:
    post:
      summary: Deposit from the system cash account
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/Cash' } } }
      responses:
        '201': { description: Posted }
  /api/v1/withdrawals:
    post:
      summary: Withdraw to the system cash account
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/Cash' } } }
      responses:
        '201': { description: Posted }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/transfers:
    post:
      summary: Transfer between two accounts
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
      responses:
        '201':
          description: Posted, or the stored response of an earlier request with the same key
          headers:
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Transaction' } }
        '409':
          description: The original request with this key is still running
          headers:
            Retry-After: { schema: { type: integer } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/fx-transfers:
    post:
      summary: Transfer across currencies through the clearing accounts
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Posted }
  /api/v1/transactions:
    get:
      summary: The journal, newest first (cursor pagination)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: accountId, in: query, schema: { type: integer } }
      responses:
        '200': { description: A page of transactions with their entries }
    post:
      summary: Post a multi-leg transaction (debits must equal credits per currency)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Posted }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/transactions/{id}:
    get:
      summary: One transaction
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: The transaction }
  /api/v1/transactions/{id}/reversals:
    post:
      summary: Reverse a transaction with a linked reversing transaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Reversal posted }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/holds:
    get:
      summary: List holds
      responses:
        '200': { description: Holds }
    post:
      summary: Authorise (reserve) funds
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Hold created }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/holds/{id}/capture:
    post:
      summary: Capture a hold, fully or partially
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Captured }
  /api/v1/holds/{id}/release:
    post:
      summary: Release a hold
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Released }
  /api/v1/webhooks/subscriptions:
    get:
      summary: List webhook subscriptions
      responses:
        '200': { description: Subscriptions }
    post:
      summary: Subscribe a URL; deliveries are signed with HMAC-SHA256 using the secret
      responses:
        '201': { description: Created }
  /api/v1/outbox/events:
    get:
      summary: Outbox events with delivery counters
      responses:
        '200': { description: A page of events }
  /api/v1/outbox/deliveries:
    get:
      summary: Deliveries, optionally filtered by status (PENDING, SENT, DEAD)
      responses:
        '200': { description: A page of deliveries }
  /api/v1/outbox/stats:
    get:
      summary: Counters and the age of the oldest pending delivery
      responses:
        '200': { description: Stats }
  /api/v1/outbox/deliveries/{id}/retry:
    post:
      summary: Put a dead-lettered delivery back in the queue
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '202': { description: Requeued }
  /api/v1/reconciliation/runs:
    get:
      summary: Stored reconciliation reports, newest first
      responses:
        '200': { description: Reports }
    post:
      summary: Run every check now
      responses:
        '201': { description: The stored report }
  /api/v1/reconciliation/runs/{id}:
    get:
      summary: One report with its findings
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: The report }
  /api/v1/reports/trial-balance:
    get:
      summary: Trial balance as of an instant
      parameters: [ { name: asOf, in: query, schema: { type: string, format: date-time } } ]
      responses:
        '200': { description: Per-account balances and per-currency totals }
  /api/v1/chaos/failpoints:
    get:
      summary: The failpoints, what each leaves behind and whether it is armed
      responses:
        '200': { description: Failpoints }
  /api/v1/chaos/failpoints/{id}/arm:
    post:
      summary: Arm a failpoint; the process halts when it is reached. 403 unless ledger.chaos.enabled=true.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Armed }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/chaos/failpoints/disarm:
    post:
      summary: Disarm every failpoint
      responses:
        '200': { description: Disarmed }
