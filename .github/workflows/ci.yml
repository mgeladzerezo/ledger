name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Unit and integration tests, including the crash matrix that kills a real application process.
      # Testcontainers uses the Docker daemon of the runner.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs
          path: target/crash-it/
      - name: Build the Docker image
        run: docker build -t ledger:ci .

  soak:
    # The randomised kill-under-load test is slow; run it on demand and nightly, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify -Psoak
